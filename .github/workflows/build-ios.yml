name: ForgeWin P1 iOS 16 IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test portable execution core
        run: bash tools/test.sh
      - name: Build ad-hoc signed ARM64 IPA
        run: bash tools/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeWin_P1_iOS16_IPA
          path: build/ForgeWin_P1_iOS16.ipa
          if-no-files-found: error
