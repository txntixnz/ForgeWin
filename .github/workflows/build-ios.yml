name: ForgeWin P2 iOS 16 IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  windows-guest:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile Windows x64 guest with MSVC
        shell: cmd
        run: tools\build-guest.cmd
      - name: Verify native Windows execution
        shell: pwsh
        run: |
          $exe = (Resolve-Path build/guest/compiled251.exe).Path
          $process = Start-Process -FilePath $exe -Wait -PassThru
          if ($process.ExitCode -ne 251) { throw "Unexpected native exit code: $($process.ExitCode)" }
          @{ native_exit_code = $process.ExitCode; sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash; compiler = 'MSVC /Od /GS-; no CRT' } | ConvertTo-Json | Set-Content -Encoding utf8 build/guest/compiled251-native.json
          Write-Output 'PASS: native Windows executable exited 251'
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-windows-guest
          path: build/guest/
          if-no-files-found: error
  build:
    needs: windows-guest
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled-windows-guest
          path: tests/
      - name: Test portable execution core
        run: bash tools/test.sh
      - name: Compare compiled guest with native Windows result
        run: python3 tools/check-compiled.py
      - name: Build ad-hoc signed ARM64 IPA
        run: bash tools/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeWin_P2_iOS16_IPA
          path: build/ForgeWin_P2_iOS16.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P2-emulator-report
          path: build/compiled251-emulated.txt
          if-no-files-found: ignore
